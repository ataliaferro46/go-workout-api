<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Sign in · workout.api</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/base.css">
<link rel="stylesheet" href="/pages/auth.css">
<script src="/shared/shared.js" defer></script>
<script src="/pages/login.js" defer></script>
</head>
<body class="auth-page">
<main class="auth-shell">
  <div class="auth-brand">
    <div class="logo-mark">/</div>
    <div class="logo-text"><strong>workout</strong><span class="dim">.api</span></div>
  </div>

  <h1>Welcome back</h1>
  <p class="lede auth-lede">Sign in to generate plans, log workouts, and pick up where you left off.</p>

  <form id="login-form" class="card padded auth-card">
    <div class="field">
      <label>Email</label>
      <input class="input" type="email" name="email" autocomplete="email" required>
    </div>
    <div class="field">
      <label>Password</label>
      <input class="input" type="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary full lg" id="submit-btn" style="margin-top: 20px;">
      <span class="btn-text">Sign in</span>
      <span class="arrow">→</span>
    </button>
    <div class="callout callout-error hidden" id="error"></div>
  </form>

  <p class="auth-switch">
    New here? <a href="/signup">Create an account →</a>
  </p>
</main>
</body>
</html>
